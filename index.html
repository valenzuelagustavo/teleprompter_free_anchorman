<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Teleprompter simple para grabar con cámara frontal en Android/Chrome">
    <title>Teleprompter</title>
    <style>
        :root {
            --overlay-padding: 2rem;
            --font-size: 2rem;
            --text-color: #ffffff;
            --text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), -2px -2px 4px rgba(0, 0, 0, 0.8);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: manipulation;
        }
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .camera-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .teleprompter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            user-select: none;
            overflow: hidden;
            z-index: 2;
        }
        .teleprompter-text {
            position: absolute;
            left: 0;
            right: 0;
            padding: 0 var(--overlay-padding);
            font-size: var(--font-size);
            line-height: 1.8;
            color: var(--text-color);
            text-shadow: var(--text-shadow);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-weight: 600;
            text-align: center;
            will-change: transform;
        }
        .teleprompter-text.position-top { top: 10%; }
        .teleprompter-text.position-center { top: 50%; transform: translateY(-50%); }
        .teleprompter-text.position-bottom { bottom: 15%; }
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            padding: 1rem 0.75rem 0.75rem 0.75rem;
            z-index: 10;
            max-height: 60vh;
            overflow-y: auto;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .controls.hidden {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label {
            color: #fff;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .control-group input, .control-group select, .control-group textarea {
            padding: 0.375rem 0.5rem;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            background-color: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.875rem;
        }
        .control-group input[type="range"] { width: 100px; }
        .control-group textarea {
            width: 100%;
            resize: vertical;
            min-height: 80px;
            max-height: 120px;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        .btn {
            padding: 0.5rem 0.75rem;
            border: none;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            background-color: #4a4a4a;
            color: #fff;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background-color: #2196F3; }
        .btn-success { background-color: #4CAF50; }
        .btn-danger { background-color: #f44336; }
        .btn-warning { background-color: #ff9800; }
        .status-bar {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
            padding: 0.375rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            z-index: 10;
            display: flex;
            gap: 0.75rem;
        }
        .recording-indicator { display: none; align-items: center; gap: 0.375rem; color: #f44336; font-weight: 600; }
        .recording-indicator.active { display: flex; }
        .recording-dot {
            width: 8px; height: 8px; background-color: #f44336; border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .video-preview {
            display: none;
            position: absolute;
            bottom: 5rem;
            right: 0.5rem;
            width: 110px;
            max-height: 150px;
            background-color: #000;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 4px;
            z-index: 10;
            overflow: hidden;
        }
        .video-preview.active { display: block; }
        #recordedVideo { width: 100%; height: 100%; object-fit: contain; }
        .download-link {
            display: none;
            position: absolute;
            bottom: 5rem;
            left: 0.5rem;
            background-color: rgba(76,175,80,0.9);
            color: #fff;
            padding: 0.5rem 0.75rem;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            z-index: 10;
        }
        .download-link.active { display: block; }
        @media (max-width: 640px) {
            :root { --font-size: 1.75rem; --overlay-padding: 1rem; }
            .controls { padding: 0.875rem 0.625rem 0.625rem 0.625rem; }
            .control-group input[type="range"] { flex: 1; }
            .btn { font-size: 0.8rem; padding: 0.4375rem 0.625rem; }
        }
        @media (orientation: landscape) and (max-height: 600px) {
            :root { --font-size: 1.5rem; --overlay-padding: 1.5rem; }
            .controls { max-height: 85vh; }
            .script-group textarea { min-height: 60px; max-height: 90px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar">
            <span id="cameraStatus">Cámara: inicializando...</span>
            <span id="recordingStatus" class="recording-indicator">
                <span class="recording-dot"></span>
                <span>GRABANDO</span>
            </span>
        </div>
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <div class="teleprompter-overlay">
                <div id="teleprompterText" class="teleprompter-text position-center"></div>
            </div>
        </div>
        <div class="video-preview" id="videoPreview">
            <video id="recordedVideo" controls playsinline></video>
        </div>
        <a id="downloadLink" class="download-link" download="teleprompter-recording.webm">Descargar video (.webm)</a>
        <div class="controls" id="controls">
            <div class="control-group">
                <button id="toggleRecordingBtn" class="btn btn-danger" disabled>Iniciar grabación</button>
                <button id="pauseScrollBtn" class="btn btn-warning" disabled>Pausar desplazamiento</button>
                <button id="toggleControlsBtn" class="btn">Ocultar controles</button>
            </div>
            <div class="control-group script-group">
                <textarea id="scriptInput" placeholder="Escribe o pega aquí tu guion... Puedes editarlo antes o después de grabar. Se guarda automáticamente." spellcheck="false"></textarea>
            </div>
            <div class="control-group">
                <label>Velocidad: <input type="range" id="speedRange" min="10" max="150" step="5" value="40"> <span id="speedValue">40</span> px/s</label>
                <label>Tamaño texto: <input type="range" id="fontSizeRange" min="1.25" max="3.5" step="0.125" value="2"> <span id="fontSizeValue">2</span> rem</label>
                <label>Posición: <select id="positionSelect"><option value="top">Arriba</option><option value="center" selected>Centro</option><option value="bottom">Abajo</option></select></label>
            </div>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const teleprompterText = document.getElementById('teleprompterText');
        const scriptInput = document.getElementById('scriptInput');
        const toggleRecordingBtn = document.getElementById('toggleRecordingBtn');
        const pauseScrollBtn = document.getElementById('pauseScrollBtn');
        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const positionSelect = document.getElementById('positionSelect');
        const cameraStatus = document.getElementById('cameraStatus');
        const recordingStatus = document.getElementById('recordingStatus');
        const controls = document.getElementById('controls');
        const videoPreview = document.getElementById('videoPreview');
        const recordedVideo = document.getElementById('recordedVideo');
        const downloadLink = document.getElementById('downloadLink');
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let scrollAnimationId = null;
        let scrollPosition = 0;
        let scrollSpeed = 40;
        let isScrolling = false;
        let isRecording = false;
        let lastTimestamp = 0;
        const STORAGE_KEY = 'teleprompter-script';
        const savedScript = localStorage.getItem(STORAGE_KEY);
        if (savedScript) {
            scriptInput.value = savedScript;
        } else {
            scriptInput.value = 'Bienvenido al teleprompter.\n\nEscribe aquí tu guion.\n\nAjusta la velocidad, tamaño y posición.\n\nEl texto solo se muestra en pantalla, no se grabará en el video.';
        }
        updateTeleprompterText();
        scriptInput.addEventListener('input', () => {
            localStorage.setItem(STORAGE_KEY, scriptInput.value);
            updateTeleprompterText();
        });
        function updateTeleprompterText() {
            teleprompterText.textContent = scriptInput.value || '';
            scrollPosition = 0;
            teleprompterText.style.transform = positionSelect.value === 'center'
                ? 'translateY(-50%) translateY(' + scrollPosition + 'px)'
                : 'translateY(' + scrollPosition + 'px)';
        }
        async function initCamera() {
            try {
                cameraStatus.textContent = 'Cámara: solicitando permiso...';
                const constraints = {
                    video: { facingMode: { ideal: 'user' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                };
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;
                cameraStatus.textContent = 'Cámara: activa (frontal)';
                toggleRecordingBtn.disabled = false;
                pauseScrollBtn.disabled = false;
                startScrolling();
            } catch (error) {
                console.error('Error:', error);
                cameraStatus.textContent = 'Error: ' + error.message;
                alert('No se pudo acceder a la cámara o al micrófono. Usa HTTPS y concede permisos.');
            }
        }
        function startScrolling() {
            if (isScrolling) return;
            isScrolling = true;
            lastTimestamp = 0;
            scroll();
        }
        function pauseScrolling() {
            isScrolling = false;
            if (scrollAnimationId) {
                cancelAnimationFrame(scrollAnimationId);
                scrollAnimationId = null;
            }
        }
        function scroll(timestamp) {
            if (!isScrolling) return;
            if (lastTimestamp === 0) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            scrollPosition -= scrollSpeed * delta;
            if (positionSelect.value === 'center') {
                teleprompterText.style.transform = 'translateY(-50%) translateY(' + scrollPosition + 'px)';
            } else {
                teleprompterText.style.transform = 'translateY(' + scrollPosition + 'px)';
            }
            scrollAnimationId = requestAnimationFrame(scroll);
        }
        toggleRecordingBtn.addEventListener('click', () => {
            if (!isRecording) startRecording();
            else stopRecording();
        });
        function startRecording() {
            if (!mediaStream) return;
            recordedChunks = [];
            const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                ? 'video/webm;codecs=vp9'
                : MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
                    ? 'video/webm;codecs=vp8'
                    : 'video/webm';
            try {
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    recordedVideo.src = url;
                    downloadLink.href = url;
                    videoPreview.classList.add('active');
                    downloadLink.classList.add('active');
                    isRecording = false;
                    toggleRecordingBtn.textContent = 'Iniciar grabación';
                    toggleRecordingBtn.classList.remove('btn-success');
                    toggleRecordingBtn.classList.add('btn-danger');
                    recordingStatus.classList.remove('active');
                    cameraStatus.textContent = 'Cámara: activa (frontal)';
                };
                mediaRecorder.start(1000);
                isRecording = true;
                toggleRecordingBtn.textContent = 'Detener grabación';
                toggleRecordingBtn.classList.remove('btn-danger');
                toggleRecordingBtn.classList.add('btn-success');
                recordingStatus.classList.add('active');
                cameraStatus.textContent = 'Grabando...';
            } catch (error) {
                console.error('Error:', error);
                alert('Error al iniciar grabación: ' + error.message);
            }
        }
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }
        pauseScrollBtn.addEventListener('click', () => {
            if (isScrolling) {
                pauseScrolling();
                pauseScrollBtn.textContent = 'Reanudar desplazamiento';
                pauseScrollBtn.classList.remove('btn-warning');
                pauseScrollBtn.classList.add('btn-primary');
            } else {
                startScrolling();
                pauseScrollBtn.textContent = 'Pausar desplazamiento';
                pauseScrollBtn.classList.remove('btn-primary');
                pauseScrollBtn.classList.add('btn-warning');
            }
        });
        toggleControlsBtn.addEventListener('click', () => {
            controls.classList.toggle('hidden');
            toggleControlsBtn.textContent = controls.classList.contains('hidden') ? 'Mostrar controles' : 'Ocultar controles';
        });
        speedRange.addEventListener('input', () => {
            scrollSpeed = parseInt(speedRange.value);
            speedValue.textContent = scrollSpeed;
        });
        fontSizeRange.addEventListener('input', () => {
            const fontSize = fontSizeRange.value;
            document.documentElement.style.setProperty('--font-size', fontSize + 'rem');
            fontSizeValue.textContent = fontSize;
        });
        positionSelect.addEventListener('change', () => {
            teleprompterText.classList.remove('position-top', 'position-center', 'position-bottom');
            teleprompterText.classList.add('position-' + positionSelect.value);
            if (positionSelect.value === 'center') {
                teleprompterText.style.transform = 'translateY(-50%) translateY(' + scrollPosition + 'px)';
            } else {
                teleprompterText.style.transform = 'translateY(' + scrollPosition + 'px)';
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isScrolling && !isRecording) {
                pauseScrolling();
                pauseScrollBtn.textContent = 'Reanudar desplazamiento';
                pauseScrollBtn.classList.remove('btn-warning');
                pauseScrollBtn.classList.add('btn-primary');
            }
        });
        window.addEventListener('load', initCamera);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (isScrolling) {
                    pauseScrolling();
                    startScrolling();
                }
            }, 300);
        });
        window.addEventListener('beforeunload', (e) => {
            if (isRecording) {
                e.preventDefault();
                e.returnValue = 'Hay una grabación en curso. ¿Seguro que quieres salir?';
            }
        });
    </script>
</body>
</html>
